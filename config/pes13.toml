# XenonRecomp config for Pro Evolution Soccer 2013 (Europe, Xbox 360)
# Paths are relative to this file.

[main]
file_path = "../game/xex/default.xex"
out_directory_path = "../generated"
switch_table_file_path = "pes13_switch_tables_all.toml"  # regenerate with tools\recomp.ps1

# Keep everything in the guest context for the first working build;
# try these optimizations only after the game runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler register save/restore helpers (each signature matched exactly once in .text)
restgprlr_14_address = 0x82A0FB80   # ld r14,-0x98(r1) ...
savegprlr_14_address = 0x82A0FB30   # std r14,-0x98(r1) ...
restfpr_14_address = 0x82A158DC     # lfd f14,-0x90(r12) ...
savefpr_14_address = 0x82A15890     # stfd f14,-0x90(r12) ...
restvmx_14_address = 0x82F30EC8     # li r11,-0x120; lvx v14,r11,r12 ...
savevmx_14_address = 0x82F30C30     # li r11,-0x120; stvx v14,r11,r12 ...
restvmx_64_address = 0x82F30F5C     # li r11,-0x400; lvx128 v64,r11,r12 ...
savevmx_64_address = 0x82F30CC4     # li r11,-0x400; stvx128 v64,r11,r12 ...

# CRT setjmp/longjmp (hand-written asm, no .pdata entries)
longjmp_address = 0x82F300A0   # calls RtlUnwind, restores r14-r31/f14-f31/vregs via r7
setjmp_address = 0x82F31160    # stores r13-r31, f14-f31 into jmp_buf at r3

